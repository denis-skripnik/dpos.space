<p><strong><a href="/golos/donate/denis-skripnik" target="_blank" rel="noopener">Поддержать автора сайта</a></strong></p>

<div id="show_accounts_list">
  <button type="button" id="accounts_toggle" class="tt" aria-expanded="false" aria-controls="accounts_list">
    <strong>Выбрать аккаунт</strong>
  </button>

  <div id="accounts_list" class="terms" hidden>
    <div id="delete_msg"></div>
    <div id="select_msg"></div>

    <form class="form" onsubmit="return false;" onclick="getRadioValue('users');">
      <div class="form-group">
        <p id="accounts"></p>
      </div>
    </form>

    <p>
      <button type="button" id="open_accounts_modal_btn">Добавить аккаунт</button>
    </p>
  </div>
</div>

<div id="accounts_modal" style="display:none;" aria-labelledby="accounts_modal_title">
  <form method="dialog" style="margin: 0;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <h2 id="accounts_modal_title" style="margin:0;">Добавить аккаунт</h2>
      <button type="submit" id="accounts_modal_close">Закрыть</button>
    </div>
  </form>

  <div id="accounts_modal_body">
    <div id="auth_msg"></div>
    <p>Ключи никуда не передаются: сохраняются в зашифрованном виде в вашем браузере.</p>

    <form class="form" onsubmit="return false;">
      <p>
        <label for="login">Ваш логин: </label>
        <input type="text" name="login" id="login" value="" required placeholder="Введите логин в Golos">
      </p>

      <p>
        <label for="posting_key">Приватный posting (постинг) ключ: </label>
        <input type="password" name="posting_key" id="posting_key" value="" required placeholder="Введите постинг ключ">
      </p>

      <p>
        <label for="active_key">Приватный active (активный) ключ: </label>
        <input type="password" name="active_key" id="active_key" value="" placeholder="Введите активный ключ">
      </p>

      <p>
        <input type="button" id="save_account_btn" value="Войти">
      </p>
    </form>

    <h2>OAuth</h2>
    <div class="loading">Загрузка...</div>

    <div class="oauth_login-form" style="display:none;">
      <button type="button" class="oauth_login">Войти</button>
    </div>

    <div class="oauth_actions" style="display:none;">
      <span class="oauth_username"></span>
      <button type="button" class="oauth_logout">Выйти</button>
    </div>

    <p>
      <a href="/golos/registration" target="_blank" rel="noopener">Создать новый аккаунт</a>
    </p>
  </div>
</div>

<script>
(function() {
  function setExpanded(isOpen) {
    var btn = document.getElementById('accounts_toggle');
    if (btn) btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }

  function toggleList() {
    var list = document.getElementById('accounts_list');
    if (!list) return;
    var isHidden = list.hasAttribute('hidden');
    if (isHidden) {
      list.removeAttribute('hidden');
      setExpanded(true);
    } else {
      list.setAttribute('hidden', '');
      setExpanded(false);
    }
  }

  var toggleBtn = document.getElementById('accounts_toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      toggleList();
    });

    toggleBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleBtn.click();
      }
    });
  }

  if (typeof window.selectAccount === 'function') {
    try { window.selectAccount(); } catch(_) {}
  }

  function openAccountsModal() {
    // если основная логика не загружена - уводим на страницу аккаунтов
    if (typeof window.saveAccount !== 'function') {
      console.error('Account management not loaded');
      return;
    }

    // биндим кнопку "Войти" один раз
    var btn = document.getElementById('save_account_btn');
    if (btn && !btn.__bound) {
      btn.__bound = true;
      btn.addEventListener('click', function() {
        try { window.saveAccount(); } catch(_) {}
      });
    }

    // fancybox, если доступен
    if (window.jQuery && jQuery.fancybox) {
      jQuery.fancybox.open({
        src: '#accounts_modal',
        type: 'inline',
        opts: {
          touch: false,
          afterShow: function() {
            var login = document.getElementById('login');
            if (login) login.focus();
          }
        }
      });
      return;
    }

    // fallback на dialog
    var dlg = document.getElementById('accounts_modal');
    if (dlg && typeof dlg.showModal === 'function') {
      dlg.showModal();
      var login = document.getElementById('login');
      if (login) login.focus();
      return;
    }

    // самый простой fallback
    document.getElementById('accounts_modal').setAttribute('open', '');
    var login2 = document.getElementById('login');
    if (login2) login2.focus();
  }

  var openBtn = document.getElementById('open_accounts_modal_btn');
  if (openBtn) {
    openBtn.addEventListener('click', function(e) {
      e.preventDefault();
      openAccountsModal();
    });
  }
})();
</script>
